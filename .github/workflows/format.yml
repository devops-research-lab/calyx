name: Format
on:
  push: null
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install stable
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy
    - name: Check formatting
      uses: actions-rs/cargo@v1
      with:
        command: fmt
        args: --all -- --check
    - name: Clippy version
      uses: actions-rs/cargo@v1
      with:
        command: clippy
        args: --version
    - name: Run clippy
      uses: actions-rs/cargo@v1
      with:
        command: clippy
        args: --all --all-targets -- --deny warnings
    - name: Checkout
      uses: actions/checkout@v4
    - name: Formatting check
      uses: astral-sh/ruff-action@v3
      with:
        args: format --check
    - name: Linting check
      uses: astral-sh/ruff-action@v3
      with:
        args: check
